<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    diska app icon.

    A capacity ring: the app's whole purpose is reading one number off a disk,
    so the mark is that gauge. Filled to roughly three quarters in the accent
    teal to match the "tight" state, with the remainder as a dark track. It is
    drawn to stay legible at 32px, so there is no fine detail: one ring, one
    gap, nothing else.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#0d0f12"/>
    </linearGradient>
  </defs>

  <!-- Rounded plate: fills the canvas edge to edge so the icon reads as a tile,
       with the corners only slightly softened. -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5"
        fill="none" stroke="#2b323b" stroke-width="3"/>

  <!-- Track and fill. Both arcs start at 12 o'clock and run clockwise; the fill
       covers 270 degrees of 360, leaving a 90 degree gap at the top right. -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#23282f" stroke-width="17"/>
  <path d="M 64 26 A 38 38 0 1 1 26 64"
        fill="none" stroke="#2dd4bf" stroke-width="17" stroke-linecap="butt"/>

  <!-- Hub, so the ring reads as a gauge rather than a plain circle. -->
  <circle cx="64" cy="64" r="13" fill="#0d0f12"/>
  <circle cx="64" cy="64" r="13" fill="none" stroke="#39414d" stroke-width="2"/>
</svg>
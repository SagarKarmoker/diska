[package]
name = "diska"
version = "0.1.0"
description = "Cross-platform disk usage analyzer and cache cleaner"
authors = ["you"]
edition = "2021"

[lib]
name = "diska_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignore = "0.4"
trash = "5"
sysinfo = "0.39"
dirs = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true